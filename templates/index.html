<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI PERSONAL ASSISTANT</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">


</head>

<body>

<h1>AI Personal Assistant</h1>

<div class="container">

    <!-- Ask to AI -->

    <h2>Ask Anything</h2>

    <form id="askForm">

        <input
            type="text"
            name="question"
            placeholder="Ask anything...."
            required
        >

        <button type="submit">Ask to AI</button>

        <p id="ask-loading" style="display: none;">Processing...</p>

        <p id="answer"></p>

    </form>

    <hr>

    <!-- Summarize Email -->

    <h2>Summarize Email</h2>

    <form id="emailForm">

        <textarea
            name="Email"
            placeholder="Paste email here...."
            required
        ></textarea>

        <button type="submit">Summarize</button>

        <p id="summary-loading" style="display: none;">Processing...</p>

        <p id="summary"></p>

    </form>

</div>


<script>

    // Ask AI

    document.getElementById("askForm").onsubmit = async (e) => {

        e.preventDefault();

        let formData = new FormData(e.target);

        let loading = document.getElementById("ask-loading");

        loading.style.display = "block";

        let res = await fetch("/ask", {

            method: "POST",
            body: formData

        });

        let data = await res.json();

        document.getElementById("answer").innerText = data.response;

        loading.style.display = "none";

    };


    // Summarize Email

    document.getElementById("emailForm").onsubmit = async (e) => {

        e.preventDefault();

        let formData = new FormData(e.target);

        let loading = document.getElementById("summary-loading");

        loading.style.display = "block";

        let res = await fetch("/summarize", {

            method: "POST",
            body: formData

        });

        let data = await res.json();

        document.getElementById("summary").innerText = data.response;

        loading.style.display = "none";

    };

</script>
```

</body>

</html>
